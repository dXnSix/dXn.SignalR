<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>dXn.SignalR WASM fixture</title>
  </head>
  <body data-dxn-signalr-wasm="loading">
    <script type="module">
      import init, {
        abort_physical_transport,
        cancel_long_streams,
        callback_count,
        configure_service,
        configure_transport,
        connect_and_probe,
        connect_stateful,
        consume_short_streams,
        pending_invocation_result,
        pending_invocation_started,
        probe_after_reconnect,
        probe_stateful_identity,
        run_functional_scenario,
        run_soak_scenario,
        run_stress_scenario,
        scenario_error,
        start_pending_invocation,
        start_stateful_stream,
        stateful_callback_count,
        stateful_callback_value,
        stateful_stream_count,
        stateful_stream_done,
        stateful_stream_value,
        trigger_callback_after_reconnect,
        trigger_stateful_callbacks,
      } from "./dxn_signalr_fixture.js";

      await init();
      const service = new URL(location.href).searchParams.get("service");
      if (!service) throw new Error("the fixture page requires ?service=<SignalR test service URL>");
      configure_service(service);
      configure_transport(new URL(location.href).searchParams.get("transport") ?? "websockets");
      globalThis.dxnSignalRFixture = {
        abortPhysicalTransport: abort_physical_transport,
        cancelLongStreams: cancel_long_streams,
        connectAndProbe: connect_and_probe,
        connectStateful: connect_stateful,
        consumeShortStreams: consume_short_streams,
        pendingInvocationResult: pending_invocation_result,
        pendingInvocationStarted: pending_invocation_started,
        probeAfterReconnect: probe_after_reconnect,
        probeStatefulIdentity: probe_stateful_identity,
        runFunctionalScenario: run_functional_scenario,
        runSoakScenario: run_soak_scenario,
        runStressScenario: run_stress_scenario,
        scenarioError: scenario_error,
        startPendingInvocation: start_pending_invocation,
        startStatefulStream: start_stateful_stream,
        statefulCallbackCount: stateful_callback_count,
        statefulCallbackValue: stateful_callback_value,
        statefulStreamCount: stateful_stream_count,
        statefulStreamDone: stateful_stream_done,
        statefulStreamValue: stateful_stream_value,
        triggerCallbackAfterReconnect: trigger_callback_after_reconnect,
        triggerStatefulCallbacks: trigger_stateful_callbacks,
        callbackCount: callback_count,
      };
      document.body.dataset.dxnSignalrWasm = "ready";
    </script>
  </body>
</html>
