[package]
name = "dxn-signalr-wasm-fixture"
version = "0.0.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
console_error_panic_hook = "0.1"
futures = "0.3"
gloo-timers = { version = "0.3", features = ["futures"] }
js-sys = "0.3"
log = "0.4"
dxn-signalr = { path = "../..", features = ["messagepack"] }
serde = { version = "1", features = ["derive"] }
wasm-bindgen = "=0.2.129"

[dependencies.wasm-bindgen-futures]
version = "0.4"

[workspace]
