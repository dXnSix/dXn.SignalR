name: Quality

# Pull requests only: a merge to master re-runs nothing the pull request already proved.
on:
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  RUSTDOCFLAGS: -D warnings

jobs:
  rustfmt:
    name: quality / rustfmt
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install pinned rustfmt
        run: rustup toolchain install 1.92.0 --profile minimal --component rustfmt
      - name: Check formatting
        run: cargo +1.92.0 fmt --all --check

  clippy:
    name: quality / clippy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install pinned Clippy
        run: rustup toolchain install 1.92.0 --profile minimal --component clippy
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: clippy-${{ runner.os }}-${{ hashFiles('Cargo.toml', 'rust-toolchain.toml') }}
      - name: Deny compiler and Clippy warnings
        run: cargo +1.92.0 clippy --all-targets --test e2e --all-features -- -D warnings

  native:
    name: quality / native (${{ matrix.os }}, Rust ${{ matrix.toolchain }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        toolchain: [1.92.0, stable]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        run: rustup toolchain install ${{ matrix.toolchain }} --profile minimal
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: native-${{ matrix.os }}-${{ matrix.toolchain }}-${{ hashFiles('Cargo.toml') }}
      - name: Check native targets and features
        run: cargo +${{ matrix.toolchain }} check --all-targets --test e2e --all-features

  wasm:
    name: quality / wasm (${{ matrix.mode }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - mode: default
            feature_args: ""
          - mode: all-features
            feature_args: --all-features
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install pinned WASM toolchain
        run: rustup toolchain install 1.92.0 --profile minimal --target wasm32-unknown-unknown
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: wasm-${{ matrix.mode }}-${{ hashFiles('Cargo.toml', 'rust-toolchain.toml') }}
      - name: Check WASM feature mode
        run: cargo +1.92.0 check --target wasm32-unknown-unknown ${{ matrix.feature_args }}

  unit-contract:
    name: quality / unit-contract (${{ matrix.protocol }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - protocol: JSON
            feature_args: --no-default-features
          - protocol: MessagePack
            feature_args: --all-features
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install pinned Rust
        run: rustup toolchain install 1.92.0 --profile minimal
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: tests-${{ matrix.protocol }}-${{ hashFiles('Cargo.toml') }}
      - name: Run service-independent unit and contract tests
        run: cargo +1.92.0 test ${{ matrix.feature_args }}

  android:
    name: quality / android (cargo ndk)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install pinned Rust with the Android targets
        run: rustup toolchain install 1.92.0 --profile minimal --target aarch64-linux-android --target x86_64-linux-android
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: android-${{ hashFiles('Cargo.toml', 'rust-toolchain.toml') }}
      - name: Install cargo-ndk
        run: cargo install cargo-ndk --version 4.1.2 --locked
      - name: Check the library and the end-to-end binary for Android
        run: |
          cargo +1.92.0 ndk -t arm64-v8a -t x86_64 -P 24 check --lib
          cargo +1.92.0 ndk -t arm64-v8a -t x86_64 -P 24 check --lib --test e2e --all-features

  ios:
    name: quality / ios (${{ matrix.target }})
    runs-on: macos-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        target: [aarch64-apple-ios, aarch64-apple-ios-sim]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install pinned Rust with the iOS target
        run: rustup toolchain install 1.92.0 --profile minimal --target ${{ matrix.target }}
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ios-${{ matrix.target }}-${{ hashFiles('Cargo.toml', 'rust-toolchain.toml') }}
      - name: Check the library and the end-to-end binary for iOS
        run: |
          cargo +1.92.0 check --lib --target ${{ matrix.target }}
          cargo +1.92.0 check --lib --test e2e --all-features --target ${{ matrix.target }}

  threaded-wasm:
    name: quality / threaded-wasm
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RUSTFLAGS: -D warnings -C target-feature=+atomics,+bulk-memory,+mutable-globals
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install the pinned nightly with rust-src
        run: rustup toolchain install nightly-2026-06-23 --profile minimal --component rust-src --target wasm32-unknown-unknown
      - name: Check the library for multithreaded browser WASM
        run: cargo +nightly-2026-06-23 check --lib --target wasm32-unknown-unknown --all-features -Z build-std=std,panic_abort

  platform:
    name: quality / platform
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DOTNET_NOLOGO: true
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Install pinned Rust with every checked target
        run: rustup toolchain install 1.92.0 --profile minimal --target wasm32-unknown-unknown --target wasm32-wasip1 --target aarch64-linux-android --target x86_64-linux-android --target aarch64-apple-ios
      - name: Install the pinned nightly for the threaded build case
        run: rustup toolchain install nightly-2026-06-23 --profile minimal --component rust-src --target wasm32-unknown-unknown
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: platform-${{ hashFiles('Cargo.toml', 'rust-toolchain.toml') }}
      - name: Install cargo-ndk
        run: cargo install cargo-ndk --version 4.1.2 --locked
      - name: Verify dependency graphs, gating, and mobile and threaded builds
        run: dotnet test dotnet/RayX.SignalR.E2E.Tests --filter Category=Platform
      - name: Upload redacted contract diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: quality-platform
          path: artifacts-temp/e2e
          if-no-files-found: ignore
          retention-days: 7

  rustdoc:
    name: quality / rustdoc
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install pinned Rust
        run: rustup toolchain install 1.92.0 --profile minimal
      - name: Build public documentation with warnings denied
        run: cargo +1.92.0 doc --all-features --no-deps

  dependency-security:
    name: quality / dependency-security
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install pinned Rust
        run: rustup toolchain install 1.92.0 --profile minimal
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Install RustSec scanner
        run: cargo install cargo-audit --locked
      - name: Scan Rust and NuGet dependency graphs
        run: dotnet test dotnet/RayX.SignalR.E2E.Tests --filter Category=DependencySecurity

  contracts:
    name: quality / contracts
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DOTNET_NOLOGO: true
      PLAYWRIGHT_BROWSERS_PATH: "0"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Install Aspire CLI
        run: dotnet tool install --global Aspire.Cli --version 13.5.3
      - name: Install pinned Rust with the browser target
        run: rustup toolchain install 1.92.0 --profile minimal --target wasm32-unknown-unknown
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            artifacts-temp/tools
          key: contracts-${{ hashFiles('Cargo.toml', 'rust-toolchain.toml', 'tests/wasm-fixture/Cargo.toml') }}
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: tools-node/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: tools-node/pnpm-lock.yaml
      - name: Install repository-local Playwright
        run: pnpm --dir tools-node install --frozen-lockfile
      - name: Verify workflow, repository, catalog and toolchain contracts
        run: dotnet test dotnet/RayX.SignalR.E2E.Tests --filter "Category=WorkflowContract|Category=Repository|Category=Catalog|Category=Toolchain"
      - name: Upload redacted contract diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: quality-contracts
          path: artifacts-temp/e2e
          if-no-files-found: ignore
          retention-days: 7
