[package]
name = "rayx-signalr"
version = "0.1.0"
edition = "2021"
rust-version = "1.92"
authors = ["RayX UI contributors", "Daniel Leiszen <daniel.leiszen@gmail.com>"]
description = "RayX SignalR client with JSON and MessagePack support on WASM and native Tokio targets."
license = "MIT"
publish = false
repository = "https://github.com/rayx-ui/RayX.SignalR"
homepage = "https://github.com/rayx-ui/RayX.SignalR"
readme = "README.md"
keywords = ["signalr", "rust", "websockets", "tokio", "messagepack"]
categories = ["network-programming", "web-programming", "asynchronous"]

[lib]
crate-type = ["rlib"]

[features]
default = ["tls-platform-verifier", "tls-ring"]
messagepack = ["rmp", "rmp-serde", "rmpv"]
# Native TLS (rustls). A secure endpoint needs one verifier feature and one provider feature;
# without them the crate builds a plaintext-only client. Browsers always use the platform's TLS.
# Verifier: the operating system's trust store (default).
tls-platform-verifier = ["dep:rustls-platform-verifier", "_rustls"]
# Verifier: the bundled Mozilla roots (also selectable per connection with `use_webpki_roots`).
tls-webpki-roots = ["dep:webpki-roots", "_rustls"]
# Provider: ring (default).
tls-ring = ["rustls?/ring", "_rustls"]
# Provider: aws-lc-rs (prebuilt NASM); takes precedence over ring when both are enabled.
tls-aws-lc-rs = ["rustls?/aws_lc_rs", "_rustls"]
# Internal: rustls plumbing shared by the TLS features.
_rustls = ["dep:rustls", "dep:tokio-rustls", "dep:rustls-pki-types", "tokio-websockets/rustls-bring-your-own-connector"]

[dependencies]
log = "0.4.29"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
serde_repr = "0.1.20"
futures = "0.3.32"
base64 = "0.22.1"
rmp = { version = "0.8", optional = true }
rmp-serde = { version = "1.3", optional = true }
rmpv = { version = "1.3", optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
ehttp = "0.6.0"
wasm-bindgen = "0.2.108"
wasm-bindgen-futures = "0.4.58"
wasm-sockets = "1.0.0"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { version = "1.49.0", default-features = false, features = ["rt", "net", "time", "sync"] }
tokio-websockets = { version = "0.13.3", default-features = false, features = ["sha1_smol", "fastrand", "client"] }
http = { version = "1.4.0", default-features = false, features = ["std"] }
hyper = { version = "1.11", default-features = false, features = ["client", "http1"] }
hyper-util = { version = "0.1.21", default-features = false, features = ["tokio"] }
http-body-util = "0.1.3"
rustls = { version = "0.23.45", default-features = false, features = ["std", "tls12", "logging"], optional = true }
tokio-rustls = { version = "0.26.4", default-features = false, optional = true }
rustls-pki-types = { version = "1.12", features = ["std"], optional = true }
rustls-platform-verifier = { version = "0.7.1", optional = true }
webpki-roots = { version = "1.0.8", optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
tokio = { version = "1.49.0", features = ["macros", "rt-multi-thread", "time"] }
env_logger = "0.11"

# Black-box end-to-end scenarios; run only through the Aspire runner (`dotnet test`).
[[test]]
name = "e2e"
path = "tests/e2e/main.rs"
test = false
